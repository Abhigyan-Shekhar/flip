[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "switchcrew"
version = "0.1.0"
description = "Durable Discord PM-to-Research collaboration over Switch"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "mcp>=1,<2",
  "cryptography>=44,<51",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: requires configured real Switch and Discord services"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.sdist]
# Local runtime state, credentials, nested demo clones and vendor bundles are not source artifacts.
only-include = [
  "src", "tests", "scripts", "deploy", "docs", "research", ".github",
  "pyproject.toml", "uv.lock", "README.md", "Dockerfile", "compose.yaml",
  ".env.example", ".python-version", ".dockerignore", ".gitignore",
]
exclude = [
  "/deploy/console-controller/agent-controller.mjs",
  "/deploy/console-controller/shared-host.mjs",
]
